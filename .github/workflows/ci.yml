name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint + Type-check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-boilerplate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nextjs-boilerplate/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

  # ---------------------------------------------------------------------------
  # 2. Testy (Vitest) — spouští se paralelně pro každý modul
  # ---------------------------------------------------------------------------
  test:
    name: Tests — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - nextjs-boilerplate
          - totp-qr
          - seat-map
          - pricing-engine
          - resale-api
          - season-passes
          - wallet-passes
          - organizer-dashboard
          - recommendation-engine
          - churn-prediction
          - optimal-send-time
          - referral-system
          - server-side-tracking
          - jwt-auth
          - rls-multitenancy
          - platform-fees
          - platform-promoters
          - venue-ownership
          - price-migration
          - promoter-onboarding
          - refund-policy
          - payout-management
          - gift-vouchers
          - event-cloning
          - inventory-holdback
          - promo-codes
          - flash-sales
          - installments
          - pdf-ticket
          - real-time-occupancy
          - upsell-engine

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.module }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --reporter=verbose --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.module }}
          path: ${{ matrix.module }}/coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Seating lint — overlap audit na live DB (Postgres service)
  # ---------------------------------------------------------------------------
  seating-lint:
    name: Seating overlap audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tixly
          POSTGRES_PASSWORD: tixly_dev
          POSTGRES_DB: tixly
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply migrations
        run: |
          # Aplikuj vše do 274 (nejnovější)
          for f in $(ls migrations/*.sql | sort -V); do
            PGPASSWORD=tixly_dev psql -h localhost -p 5433 -U tixly -d tixly -f "$f" -v ON_ERROR_STOP=1 -q || true
          done
        env:
          PGPASSWORD: tixly_dev

      - name: Seed venues + charts (minimal)
        run: |
          PGPASSWORD=tixly_dev psql -h localhost -p 5433 -U tixly -d tixly -c \
            "SELECT COUNT(*) FROM catalog.venue_seating_charts WHERE active = TRUE;" || true

      - name: Install pg for script
        working-directory: nextjs-boilerplate
        run: npm ci

      - name: Run seating overlap audit
        run: node scripts/lint-seating.mjs
        env:
          DATABASE_URL: postgresql://tixly:tixly_dev@localhost:5433/tixly

  # ---------------------------------------------------------------------------
  # 4. Build (Next.js) — jen pokud lint + testy prošly
  # ---------------------------------------------------------------------------
  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: nextjs-boilerplate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nextjs-boilerplate/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Placeholder values pro build — nekontaktují reálné služby
          DATABASE_URL: postgresql://user:pass@localhost:5432/tixly
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: placeholder-secret-for-build-only-32ch
          NEXT_PUBLIC_APP_URL: https://tixly.cz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: nextjs-boilerplate/.next/
          retention-days: 1
