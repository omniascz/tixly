name: Deploy

on:
  push:
    branches:
      - main     # → produkce
      - develop  # → staging

# Jeden deploy najednou per branch
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false   # deploy nikdy nepřerušuj — počkej na dokončení

jobs:
  # ---------------------------------------------------------------------------
  # Deploy na Vercel
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy → ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: |
          vercel pull --yes \
            --environment=${{ github.ref_name == 'main' && 'production' || 'preview' }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: nextjs-boilerplate

      - name: Build pro Vercel
        run: |
          vercel build \
            ${{ github.ref_name == 'main' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: nextjs-boilerplate

      - name: Deploy na Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt \
            ${{ github.ref_name == 'main' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT
        working-directory: nextjs-boilerplate

      - name: Komentář na PR s URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Deploy dokončen: ${{ steps.deploy.outputs.url }}`
            })

  # ---------------------------------------------------------------------------
  # DB migrace (jen pro main → produkce)
  # ---------------------------------------------------------------------------
  # TVRDÁ PODMÍNKA: bez průchodu RLS gate se migrace nepouští.
  # BUNDLE_340-348_prod.sql byl dosud jediné, co drift RLS vracelo zpět;
  # baseline se aplikuje jednou, takže tuhle roli přebírá gate.
  # Viz .github/workflows/README.md a FINDINGS §58.
  rls-gate:
    name: RLS gate (před migracemi)
    needs: deploy
    if: github.ref_name == 'main'
    uses: ./.github/workflows/rls-gate.yml
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

  migrate:
    name: DB migrace (produkce)
    runs-on: ubuntu-latest
    needs: [deploy, rls-gate]
    if: github.ref_name == 'main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Hola smycka `psql -f` nemela ON_ERROR_STOP, evidenci ani zastaveni pri
      # chybe — pokracovala dal a hlasila uspech. Runner ma vsechno tri.
      # MUSI to byt psql, ne node-pg: 000_baseline nese psql meta-prikazy
      # (pg_dump 17), pres SQL driver da 42601 a NEAPLIKUJE SE (FINDINGS 33).
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Spustit migrace (runner s ON_ERROR_STOP + evidenci)
        run: ./scripts/run-migrations.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Exit kod migraci neni dukaz, ze efekt nastal (warningy 27/29).
      - name: Overit RLS po migracich
        working-directory: nextjs-boilerplate
        run: npm ci --no-audit --no-fund && node scripts/rls-verify.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
