name: Deploy

# Kolo 5: spouštěč byl `main`/`develop`, výchozí větev repa je ale `master` → deploy.yml nikdy
# neběžel (0 běhů). Nasazení teď běží z `master` a TVRDĚ vyžaduje úspěch tří bran, volaných jako
# reusable workflowy (bez filtru cest, tedy na každý push):
#   ci            — install, typecheck, lint (baseline), unit, live proti DB z migrací pod tixly_app
#   schema-drift  — SQL v kódu vs schéma postavené z migrací
#   rls-gate      — policies DB z migrací vs rls-snapshot.json (verify-migrations)
# Kontrola RLS PRODUKCE běží po migracích (job migrate, rls-verify s DATABASE_URL).

# Kolo 6: JEN push do master. Žádný pull_request ani workflow_dispatch — ruční spuštění jde vybrat
# na libovolné větvi a nasadilo by neschválený kód. Každý job navíc hlídá ref (pojistka).
on:
  push:
    branches: [master]

# Jeden deploy najednou per větev
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false   # deploy nikdy nepřerušuj — počkej na dokončení

permissions:
  contents: read

jobs:
  ci:
    name: Brána — CI
    uses: ./.github/workflows/ci.yml

  schema-drift:
    name: Brána — schema drift guard
    uses: ./.github/workflows/schema-drift-guard.yml

  rls-gate:
    name: Brána — RLS gate (DB z migrací)
    uses: ./.github/workflows/rls-gate.yml
    with:
      target: 'pre-deploy (migrace)'
      production: false
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ---------------------------------------------------------------------------
  # Deploy na Vercel — jen když prošly všechny tři brány
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy → production
    needs: [ci, schema-drift, rls-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: nextjs-boilerplate

      - name: Build pro Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: nextjs-boilerplate

      - name: Deploy na Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
        working-directory: nextjs-boilerplate

  # ---------------------------------------------------------------------------
  # DB migrace (produkce) — po deployi; efekt na RLS se ověřuje proti produkci
  # ---------------------------------------------------------------------------
  migrate:
    name: DB migrace (produkce)
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Hola smycka `psql -f` nemela ON_ERROR_STOP, evidenci ani zastaveni pri
      # chybe — pokracovala dal a hlasila uspech. Runner ma vsechno tri.
      # MUSI to byt psql, ne node-pg: 000_baseline nese psql meta-prikazy
      # (pg_dump 17), pres SQL driver da 42601 a NEAPLIKUJE SE (FINDINGS 33).
      # psql 17 z PGDG — apt na ubuntu-latest dava 16, ktere meta-prikazy pg_dump 17.10 nezna.
      - name: Install postgresql-client 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-17

      - name: Spustit migrace (runner s ON_ERROR_STOP + evidenci)
        run: ./scripts/run-migrations.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Exit kod migraci neni dukaz, ze efekt nastal (warningy 27/29).
      - name: Overit RLS produkce po migracich
        working-directory: nextjs-boilerplate
        run: npm ci --no-audit --no-fund && node scripts/rls-verify.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
