name: Schema Drift Guard

# Kontrakt-test: každý statický SQL dotaz v src/ se PREPARE-uje proti schématu a chytí drift
# (kód proti jinému schématu → runtime 42703/42P01) v CI, ne až v produkci.
#
# Kolo 4: zdroj pravdy je DB postavená OD NULY z migrations/ v service kontejneru — žádný
# NEON_API_KEY ani jiné produkční tajemství (dřív 3/3 běhy padly na "need NEON_API_KEY", repo
# žádné secrets nemá). Filtr cest navíc mířil na neexistující nextjs-boilerplate/migrations/**.
# Baseline režim: padá jen na NOVÉM driftu nad scripts/schema-drift-baseline.migrations.json.
#
# BEZPEČNOST: trigger je `pull_request` (ne `pull_request_target`) a job nepotřebuje žádné secrets.

on:
  push:
    branches: [main, master, 'fix/**']
    paths:
      - 'nextjs-boilerplate/src/**'
      - 'migrations/**'
      - 'nextjs-boilerplate/scripts/schema-drift-guard.mjs'
      - 'nextjs-boilerplate/scripts/schema-drift-baseline.migrations.json'
      - '.github/scripts/build-db-from-migrations.sh'
      - '.github/actions/db-from-migrations/**'
      - '.github/workflows/schema-drift-guard.yml'
  pull_request:
    paths:
      - 'nextjs-boilerplate/src/**'
      - 'migrations/**'
      - 'nextjs-boilerplate/scripts/schema-drift-guard.mjs'
      - 'nextjs-boilerplate/scripts/schema-drift-baseline.migrations.json'
      - '.github/scripts/build-db-from-migrations.sh'
      - '.github/actions/db-from-migrations/**'
      - '.github/workflows/schema-drift-guard.yml'
  workflow_dispatch:

concurrency:
  group: schema-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-drift:
    name: Schema drift (SQL vs schéma z migrací)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: neondb_owner
          POSTGRES_PASSWORD: fixowner   # heslo izolované testovací DB, ne produkční
          POSTGRES_DB: neondb
        ports: ['55632:5432']
        options: >-
          --health-cmd "pg_isready -U neondb_owner" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nextjs-boilerplate/package-lock.json

      - name: DB od nuly z migrací (psql 17)
        uses: ./.github/actions/db-from-migrations
        with:
          db: drift

      - name: Install
        working-directory: nextjs-boilerplate
        run: npm ci --no-audit --no-fund

      # Exit 1 = NOVÝ drift nad baseline, 2 = chyba nástroje — obojí shodí job.
      - name: Run schema-drift guard
        working-directory: nextjs-boilerplate
        run: >-
          node scripts/schema-drift-guard.mjs
          --url postgresql://neondb_owner:fixowner@localhost:55632/drift
          --baseline scripts/schema-drift-baseline.migrations.json
