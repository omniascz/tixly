name: RLS Gate

# ── Proč tenhle workflow existuje ────────────────────────────────────────────
# `BUNDLE_340-348_prod.sql` byl dosud jediné, co drift RLS vracelo zpět —
# pouštěl se opakovaně a přepisoval, co se rozešlo. Baseline se aplikuje JEDNOU,
# takže tahle samoopravná vlastnost zmizí. Bez tohohle gate by se drift projevil
# až tím, že aplikace přestane vidět data (nebo je začne vidět všem).
#
# Gate porovnává živou DB proti `rls-snapshot.json`, který je vygenerovaný
# z MIGRACÍ, ne z produkce (jinak by ověřoval realitu proti realitě).
#
# Čím se liší od ostatních dvou kontrol — viz .github/workflows/README.md.

on:
  # 1) noční kontrola produkce — chytí drift, který vznikl mimo deploy
  schedule:
    - cron: '17 2 * * *'
  # 2) volatelné z deploy.yml jako TVRDÁ podmínka před nasazením
  workflow_call:
    inputs:
      target:
        description: 'popis cíle (jen do logu)'
        required: false
        type: string
    secrets:
      DATABASE_URL:
        required: true
      NEON_API_KEY:
        # volitelny — potrebuje ho jen nocni sken, ne pre-deploy gate
        required: false
  # 3) na změnu čehokoli, co gate nebo očekávaný stav definuje
  pull_request:
    paths:
      - 'migrations/**'
      - 'nextjs-boilerplate/rls-snapshot.json'
      - 'nextjs-boilerplate/scripts/rls-verify.mjs'
      - '.github/workflows/rls-gate.yml'
  workflow_dispatch:

concurrency:
  group: rls-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: RLS verify (policies vs snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: nextjs-boilerplate
        run: npm ci --no-audit --no-fund

      - name: RLS gate
        working-directory: nextjs-boilerplate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/rls-verify.mjs

      # Sken je DRAHÝ (staví klon), proto jen v noci — ne před každým deployem.
      - name: Schema reality scan (jen noční běh)
        if: github.event_name == 'schedule'
        working-directory: nextjs-boilerplate
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/schema-reality-scan.mjs --ephemeral

  # Snapshot musel dosud clovek pregenerovat rucne po kazde migraci menici RLS.
  # Rucni krok, na ktery se zapomene, je tataz trida jako capacity_remaining —
  # proto to hlida BUILD (ne deploy): postavi klon z migraci, vygeneruje
  # snapshot a porovna s commitnutou verzi.
  snapshot-drift:
    name: Snapshot je aktualni vuci migracim
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        working-directory: nextjs-boilerplate
        run: npm ci --no-audit --no-fund

      - name: Postavit klon z migraci a porovnat snapshot
        working-directory: nextjs-boilerplate
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          node scripts/baseline-clone.mjs /tmp/clone.json
          node -e "
            const {execSync}=require('child_process');
            const c=require('/tmp/clone.json');
            for (const f of ['453_users_select_scoped.sql','454_rls_cast_nullif_fix.sql','455_rls_namedrift_identity.sql'])
              execSync('psql \"'+c.ownerUri+'\" -v ON_ERROR_STOP=1 -f ../migrations/'+f,{stdio:'inherit'});
          "
          node scripts/rls-verify.mjs --snapshot             --url="$(node -e "console.log(require('/tmp/clone.json').ownerUri)")"             --snapshot-file=/tmp/expected.json
          node -e "
            const a=require('/tmp/expected.json'), b=require('./rls-snapshot.json');
            const k=o=>JSON.stringify({p:o.policies,r:o.rlsTables,h:o.helpers});
            if (k(a)===k(b)) { console.log('snapshot je aktualni'); process.exit(0); }
            console.error('rls-snapshot.json ZAOSTAVA za migracemi.');
            console.error('Pregeneruj:  node scripts/rls-verify.mjs --snapshot --url=<klon>');
            process.exit(1);
          "
