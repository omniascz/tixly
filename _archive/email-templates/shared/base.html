<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tixly</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <!-- Email client preheader text -->
  <div style="display: none; max-height: 0; overflow: hidden;">{{preheaderText}}</div>

  <!-- Main container -->
  <table cellpadding="0" cellspacing="0" border="0" style="width: 100%; background-color: #f8fafc;">
    <tr>
      <td style="padding: 0; text-align: center;">
        <!-- Outer wrapper for centering -->
        <table cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 600px; margin: 0 auto; background-color: #ffffff;">
          <!-- Header with branding -->
          <tr>
            <td style="background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); padding: 30px 20px; text-align: center;">
              <h1 style="margin: 0; color: #ffffff; font-size: 28px; font-weight: 700; letter-spacing: -0.5px;">Tixly</h1>
              <p style="margin: 8px 0 0 0; color: rgba(255, 255, 255, 0.9); font-size: 14px; font-weight: 400;">Vaše vstupenky na jediném místě</p>
            </td>
          </tr>

          <!-- Content area -->
          <tr>
            <td style="padding: 40px 30px;">
              {{{content}}}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="border-top: 1px solid #e2e8f0; padding: 30px 20px; background-color: #f8fafc; text-align: center;">
              <table cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
                <tr>
                  <td style="font-size: 13px; color: #64748b; line-height: 1.6;">
                    <p style="margin: 0 0 12px 0;">Tixly s.r.o.<br>Palác Ahoj, Příkopy 25<br>110 00 Praha 1, Česká republika</p>
                    <p style="margin: 0;">
                      <a href="{{unsubscribeUrl}}" style="color: #6366f1; text-decoration: none; font-size: 12px;">Odhlásit se z notifikací</a>
                    </p>
                  </td>
                </tr>
              </table>
              <p style="margin: 20px 0 0 0; font-size: 12px; color: #94a3b8;">© 2026 Tixly. Všechna práva vyhrazena.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
